version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/quiz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /serverless
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      serverless-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend/quiz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend-docker:
        patterns:
          - "*"
