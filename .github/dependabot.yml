# Dependabot configuration format.
version: 2
# Each entry checks weekly, waits seven days after a release before proposing
# version updates, and groups matching dependencies for that ecosystem.
# The cooldown applies to version updates, not security updates.
updates:
  # Update and group npm dependencies for the frontend.
  - package-ecosystem: npm
    directory: /frontend/quiz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # Update and group npm dependencies for the serverless backend.
  - package-ecosystem: npm
    directory: /serverless
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      serverless-dependencies:
        patterns:
          - "*"

  # Update and group GitHub Actions referenced by repository workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Update and group Docker image dependencies in the frontend directory.
  - package-ecosystem: docker
    directory: /frontend/quiz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-docker:
        patterns:
          - "*"
