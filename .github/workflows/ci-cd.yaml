name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  ci:
    name: Continuous Integration & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test EC2 frontend deployment script
        run: bash .github/scripts/test-deploy-frontend.sh

      # =========================
      # 0. SECRET SCANNING (Gitleaks)
      # =========================
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/quiz/package-lock.json
            backend/package-lock.json
            serverless/package-lock.json

      # =========================
      # 1. FRONTEND: LINT, AUDIT & TEST
      # =========================

      - name: Install frontend dependencies
        working-directory: frontend/quiz
        run: npm ci

      - name: Frontend Audit (SCA)
        working-directory: frontend/quiz
        run: npm audit --audit-level=high

      - name: Frontend Lint and Fix
        working-directory: frontend/quiz
        run: npm run lint -- --fix

      - name: Frontend Lint
        working-directory: frontend/quiz
        run: npm run lint

      - name: Run frontend Test
        working-directory: frontend/quiz
        run: npm test

      - name: Build frontend
        working-directory: frontend/quiz
        run: npm run build

      # =========================
      # 2. BACKEND: LINT, AUDIT & TEST
      # =========================

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Audit (SCA)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Backend Lint
        working-directory: backend
        run: npm run lint

      - name: Backend Lint and Fix
        working-directory: backend
        run: npm run lint -- --fix

      #  - name: Backend Lint
      #   working-directory: backend
      #  run: npm run lint

      - name: Run backend Test
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      # =========================
      # 2b. SERVERLESS BACKEND (Lambda + DynamoDB): LINT, AUDIT, TEST & BUILD
      # =========================

      - name: Install serverless dependencies
        working-directory: serverless
        run: npm ci

      - name: Serverless Audit (SCA)
        working-directory: serverless
        run: npm audit --audit-level=high

      - name: Serverless Lint
        working-directory: serverless
        run: npm run lint

      - name: Run serverless tests
        working-directory: serverless
        run: npm test

      - name: Build serverless handlers
        working-directory: serverless
        run: npm run build

      # =========================
      # 3. SAST SCANNING (Semgrep)
      # =========================

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      # =========================
      # 4. BDD & E2E TESTING (Playwright)
      # =========================

      - name: Install Playwright browser
        working-directory: frontend/quiz
        run: npx playwright install --with-deps chromium

      - name: Run Playwright BDD tests
        working-directory: frontend/quiz
        env:
          TEST_ENV: local
          CI: true
        run: |
          npx bddgen
          npx playwright test

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/quiz/test-results/
            frontend/quiz/playwright-report/
          retention-days: 7

      ## - name: Run Playwright BDD tests
      ## run: |
      ##  cd backend
      ## npm start &
      ## sleep 15
      ## cd ../frontend/quiz
      ## npm run test:ui

  cd:
    name: Continuous Deployment (Docker)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/quiz
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  # AWS deployment runs only after CI passes on a push to main. It is separate
  # from the GHCR image-publishing job above.
  deploy-backend-aws:
    name: Deploy serverless backend (AWS SAM)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize backend deployments so stack updates do not overlap.
    concurrency: deploy-aws-backend
    permissions:
      contents: read
      # Required for GitHub OIDC to obtain temporary AWS role credentials.
      id-token: write
    outputs:
      # The frontend build consumes the deployed stack's API base URL.
      api-url: ${{ steps.api.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json

      # Install SAM for packaging and deploying the serverless template.
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Assume the configured AWS role using GitHub's OIDC token.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Each job starts on a fresh runner, so install and rebuild the Lambda
      # bundles even though CI built them earlier.
      - name: Build handlers
        working-directory: serverless
        run: |
          npm ci
          npm run build

      # SAM uploads deployment artifacts to a resolved S3 bucket and updates
      # the CloudFormation stack, including its IAM resources. An empty change
      # set is treated as success; the JWT secret is passed as a parameter.
      - name: Deploy stack
        working-directory: serverless
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sam deploy \
            --stack-name quiz-serverless \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AllowedOrigin=${{ vars.FRONTEND_ORIGIN }}" \
              "SupabaseUrl=${{ vars.SUPABASE_URL }}" \
              "JwtSecret=$JWT_SECRET"

      # Expose the CloudFormation output to the dependent frontend job.
      - name: Read API URL
        id: api
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name quiz-serverless \
            --region "${{ vars.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Build only after backend deployment succeeds so Vite receives its API URL.
  deploy-frontend-aws:
    name: Deploy frontend (ECR + EC2)
    needs: deploy-backend-aws
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize frontend deployments to avoid overlapping EC2 container changes.
    concurrency: deploy-aws-frontend
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # This job needs its own temporary OIDC credentials on its fresh runner.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Authenticate Docker and capture the registry address for image tags.
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Vite settings are embedded at build time. Publish both a convenient
      # latest tag and a commit-specific tag used for the actual deployment.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/quiz
          file: ./frontend/quiz/Dockerfile.prod
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ needs.deploy-backend-aws.outputs.api-url }}
            VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/quiz-frontend:latest
            ${{ steps.ecr.outputs.registry }}/quiz-frontend:${{ github.sha }}

      # Run the checked-in deployment script on the instance through SSM.
      # jq shell-quotes the image, region and script before constructing the
      # command document; the commit tag selects the image built in this job.
      - name: Restart container on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          parameters=$(jq -nc \
            --arg image "$REGISTRY/quiz-frontend:$GITHUB_SHA" \
            --arg region "$REGION" \
            --rawfile script .github/scripts/deploy-frontend.sh \
            '{commands: [("export IMAGE=" + ($image | @sh) + " REGION=" + ($region | @sh) + "\nbash -c " + ($script | @sh))]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $id"
          # Preserve the waiter result while still retrieving diagnostics when
          # the remote deployment fails.
          if aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE_ID"; then
            result=0
          else
            result=$?
          fi
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
          exit "$result"
