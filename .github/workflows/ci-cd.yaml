name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  ci:
    name: Continuous Integration & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 0. SECRET SCANNING (Gitleaks)
      # =========================
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/quiz/package-lock.json
            backend/package-lock.json
            serverless/package-lock.json

      # =========================
      # 1. FRONTEND: LINT, AUDIT & TEST
      # =========================

      - name: Install frontend dependencies
        working-directory: frontend/quiz
        run: npm ci

      - name: Frontend Audit (SCA)
        working-directory: frontend/quiz
        run: npm audit --audit-level=high

      - name: Frontend Lint
        working-directory: frontend/quiz
        run: npm run lint

      - name: Frontend Lint and Fix
        working-directory: frontend/quiz
        run: npm run lint -- --fix

      ##- name: Run frontend Test
      ## working-directory: frontend/quiz
      ##run: npm test

      - name: Build frontend
        working-directory: frontend/quiz
        run: npm run build

      # =========================
      # 2. BACKEND: LINT, AUDIT & TEST
      # =========================

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Audit (SCA)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Backend Lint
        working-directory: backend
        run: npm run lint

      - name: Backend Lint and Fix
        working-directory: backend
        run: npm run lint -- --fix

      #  - name: Backend Lint
      #   working-directory: backend
      #  run: npm run lint

      - name: Run backend Test
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      # =========================
      # 2b. SERVERLESS BACKEND (Lambda + DynamoDB): AUDIT, TEST & BUILD
      # =========================

      - name: Install serverless dependencies
        working-directory: serverless
        run: npm ci

      - name: Serverless Audit (SCA)
        working-directory: serverless
        run: npm audit --audit-level=high

      - name: Run serverless tests
        working-directory: serverless
        run: npm test

      - name: Build serverless handlers
        working-directory: serverless
        run: npm run build


      # =========================
      # 3. SAST SCANNING (Semgrep)
      # =========================

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      # =========================
      # 4. BDD & E2E TESTING (Playwright)
      # =========================

      - name: Install Playwright browser
        working-directory: frontend/quiz
        run: npx playwright install --with-deps chromium

      ## - name: Run Playwright BDD tests
      ## run: |
      ##  cd backend
      ## npm start &
      ## sleep 15
      ## cd ../frontend/quiz
      ## npm run test:ui

  cd:
      name: Continuous Deployment (Docker)
      needs: ci
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extract metadata (tags, labels) for Frontend
          id: meta-frontend
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}-frontend

        - name: Extract metadata (tags, labels) for Backend
          id: meta-backend
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}-backend

        - name: Build and push Frontend Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./frontend/quiz
            push: true
            tags: ${{ steps.meta-frontend.outputs.tags }}
            labels: ${{ steps.meta-frontend.outputs.labels }}

        - name: Build and push Backend Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            push: true
            tags: ${{ steps.meta-backend.outputs.tags }}
            labels: ${{ steps.meta-backend.outputs.labels }}

  deploy-backend-aws:
    name: Deploy serverless backend (AWS SAM)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-aws-backend
    permissions:
      contents: read
      id-token: write
    outputs:
      api-url: ${{ steps.api.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build handlers
        working-directory: serverless
        run: |
          npm ci
          npm run build

      - name: Deploy stack
        working-directory: serverless
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sam deploy \
            --stack-name quiz-serverless \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AllowedOrigin=${{ vars.FRONTEND_ORIGIN }}" \
              "SupabaseUrl=${{ vars.SUPABASE_URL }}" \
              "JwtSecret=$JWT_SECRET"

      - name: Read API URL
        id: api
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name quiz-serverless \
            --region "${{ vars.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy-frontend-aws:
    name: Deploy frontend (ECR + EC2)
    needs: deploy-backend-aws
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-aws-frontend
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/quiz
          file: ./frontend/quiz/Dockerfile.prod
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ needs.deploy-backend-aws.outputs.api-url }}
            VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/quiz-frontend:latest
            ${{ steps.ecr.outputs.registry }}/quiz-frontend:${{ github.sha }}

      - name: Restart container on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[
              \"aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/quiz-frontend:latest\",
              \"docker rm -f \$(docker ps -aq) || true\",
              \"docker run -d --name quiz-frontend --restart unless-stopped -p 80:80 $REGISTRY/quiz-frontend:latest\"
            ]}" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE_ID"
