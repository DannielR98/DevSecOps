name: CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/quiz/package-lock.json

      # =========================
      # FRONTEND
      # =========================

      - name: Install frontend dependencies
        working-directory: frontend/quiz
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend/quiz
        run: npm audit --audit-level=high

      - name: Run fontend Test
        working-directory: frontend/quiz
        run: npm test
        
      - name: Build frontend
        working-directory: frontend/quiz
        run: npm run build

      

      # =========================
      # BACKEND
      # =========================

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run backend Test
        working-directory: backend
        run: npm test
        
      - name: Build backend
        working-directory: backend
        run: npm run build



      # =========================
      # DOCKER
      # =========================

      - name: Build frontend Docker image
        run: docker build -t quiz-img-frontend ./frontend/quiz

      - name: Build backend Docker image
        run: docker build -t quiz-img-backend ./backend


      # =========================
      # LIST FILES
      # =========================

      - name: List frontend and backend files
        run: |
          echo "===== FRONTEND ====="
          ls -la frontend/quiz

          echo "===== BACKEND ====="
          ls -la backend

      # =========================
      # SUCCESS
      # =========================

      - name: CI completed successfully
        run: echo "CI completed successfully!"
