name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write 

jobs:
  ci:
    name: Continuous Integration & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/quiz/package-lock.json
            backend/package-lock.json

      # =========================
      # 1. FRONTEND: LINT, AUDIT & TEST
      # =========================

      - name: Install frontend dependencies
        working-directory: frontend/quiz
        run: npm ci

      - name: Build frontend
        working-directory: frontend/quiz
        run: npm audit --audit-level=high

      - name: Run frontend Test
        working-directory: frontend/quiz
        run: npm test

      # =========================
      # BACKEND
      # =========================

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run backend Test
        working-directory: backend
        run: npm test
        
      - name: Build backend
        working-directory: backend
        run: npm run build



      # =========================
      # 3. SAST SCANNING (Semgrep)
      # =========================

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto


  cd:
      name: Continuous Deployment (Docker)
      needs: ci
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extract metadata (tags, labels) for Frontend
          id: meta-frontend
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}-frontend

        - name: Extract metadata (tags, labels) for Backend
          id: meta-backend
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}-backend

        - name: Build and push Frontend Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./frontend/quiz
            push: true
            tags: ${{ steps.meta-frontend.outputs.tags }}
            labels: ${{ steps.meta-frontend.outputs.labels }}

        - name: Build and push Backend Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            push: true
            tags: ${{ steps.meta-backend.outputs.tags }}
            labels: ${{ steps.meta-backend.outputs.labels }}