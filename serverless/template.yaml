# CloudFormation template version and SAM transform for serverless resources.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Quiz app backend - API Gateway HTTP API, Lambda functions and DynamoDB

# Deployment-specific settings. NoEcho prevents CloudFormation from displaying
# the provided secrets in its normal parameter output.
Parameters:
  # The stage name is part of the deployed API URL.
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
  # Browsers may call the API from this single frontend origin.
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Frontend origin allowed by CORS
  # Used for application-issued login tokens; provide a secret at deployment.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HS256 secret used to sign tokens issued by /api/login
  # Enables verification against the Supabase project's remote public keys.
  SupabaseUrl:
    Type: String
    Default: ""
    Description: Supabase project URL (used to fetch the JWKS for Supabase tokens)
  # Optional shared secret for projects issuing legacy HS256 tokens.
  SupabaseJwtSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional legacy Supabase HS256 JWT secret
  # Override the architecture and timeout for local emulation if necessary.
  FunctionArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  # Default Lambda timeout in seconds; individual functions may override it.
  FunctionTimeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 900

# All handlers share the bundled code, runtime, configuration and table names.
# SAM Local overrides selected environment variables for its local database.
Globals:
  Function:
    # Default runtime, architecture and resource limits for every Lambda.
    Runtime: nodejs22.x
    Architectures: [!Ref FunctionArchitecture]
    MemorySize: 256
    Timeout: !Ref FunctionTimeout
    # npm run build produces the handler modules in this shared directory.
    CodeUri: dist/
    Environment:
      Variables:
        # Resource names and notification settings shared by the handlers.
        USERS_TABLE: !Ref UsersTable
        GROUPS_TABLE: !Ref GroupsTable
        MEMBERS_TABLE: !Ref GroupMembersTable
        QUIZZES_TABLE: !Ref QuizzesTable
        OUTBOX_TABLE: !Ref OutboxTable
        NOTIFICATION_LOCK_TABLE: !Ref NotificationLockTable
        NOTIFICATIONS_DISABLED: "false"
        EVENT_BUS_NAME: !Ref QuizEventBus
        SNS_TOPIC_ARN_PREFIX: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-quiz-group-"
        RESULTS_TABLE: !Ref QuizResultsTable
        UNIQUES_TABLE: !Ref UniqueKeysTable
        # An empty endpoint uses AWS; local startup overrides it for DynamoDB Local.
        DYNAMODB_ENDPOINT: ""
        # Token verification and signing configuration.
        JWT_SECRET: !Ref JwtSecret
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_JWT_SECRET: !Ref SupabaseJwtSecret

Resources:
  # ---------------------------------------------------------------- API
  # API Gateway handles deployed CORS and applies the default route throttles.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # Allow the configured frontend origin to send API requests.
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        # Browsers may cache preflight responses for up to 600 seconds.
        MaxAge: 600
      DefaultRouteSettings:
        # Default API Gateway throttling limits: burst and sustained requests.
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        # All routes inherit this authorizer unless they explicitly opt out.
        DefaultAuthorizer: TokenAuthorizer
        Authorizers:
          TokenAuthorizer:
            FunctionArn: !GetAtt TokenAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            # The authorizer returns an isAuthorized boolean.
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers: [Authorization]
              # Disable authorizer result caching; a missing header is rejected
              # by API Gateway before the authorizer is invoked.
              ReauthorizeEvery: 0

  # ---------------------------------------------------------------- IAM
  # The API Lambda role grants access to the named tables, indexes and
  # group notification subscriptions used by the handlers.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      # Only Lambda may assume this role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      # Basic execution permissions include writing Lambda logs to CloudWatch.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CRUD operations and indexed queries for application data.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                # Queries against secondary indexes need their index ARNs too.
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt GroupsTable.Arn
                  - !Sub "${GroupsTable.Arn}/index/*"
                  - !GetAtt GroupMembersTable.Arn
                  - !Sub "${GroupMembersTable.Arn}/index/*"
                  - !GetAtt QuizzesTable.Arn
                  - !Sub "${QuizzesTable.Arn}/index/*"
                  - !GetAtt QuizResultsTable.Arn
                  - !Sub "${QuizResultsTable.Arn}/index/*"
                  - !GetAtt UniqueKeysTable.Arn
              # Quiz creation writes an outbox event with the quiz.
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt OutboxTable.Arn
              # Scans support user, group and membership operations.
              - Effect: Allow
                Action: dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt GroupsTable.Arn
                  - !GetAtt GroupMembersTable.Arn
              # The notification lock coordinates profile and membership changes.
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt NotificationLockTable.Arn
              # API mutations can clean up group notification subscriptions.
              - Effect: Allow
                Action: [sns:ListSubscriptionsByTopic, sns:Unsubscribe, sns:DeleteTopic]
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-quiz-group-*"

  # Separate role for the outbox relay, reconciliation and notification Lambdas.
  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NotificationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read notification inputs, remove relayed events and use the lock.
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:GetItem]
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt GroupsTable.Arn
                  - !GetAtt GroupMembersTable.Arn
                  - !GetAtt OutboxTable.Arn
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt OutboxTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt NotificationLockTable.Arn
              # Publish outbox events to the application's EventBridge bus.
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt QuizEventBus.Arn
              # Listing topics is account-wide; topic mutations are prefix-scoped.
              - Effect: Allow
                Action: sns:ListTopics
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:ListSubscriptionsByTopic
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:Publish
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-quiz-group-*"
              # Lambda asynchronous failures are sent to the failure queue.
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt NotificationFailureQueue.Arn

  # ---------------------------------------------------------------- DynamoDB
  # Retain tables on stack deletion/replacement and enable point-in-time
  # recovery. Secondary indexes below support repository lookup patterns.
  # PAY_PER_REQUEST avoids configuring provisioned read/write capacity.
  # AttributeDefinitions lists key attributes, not every stored item field.
  # Store user profiles by user_id.
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }

  # Lock items enforcing uniqueness (email, username, auth_id, invite code)
  # and acting as lookup indexes for them.
  UniqueKeysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }

  # Owner lookup supports listing groups even when membership records are missing.
  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: owner_id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: owner_id-index
          KeySchema:
            - { AttributeName: owner_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # Membership IDs are derived from group and user IDs in the repository.
  # Separate indexes support listing members of a group and groups of a user.
  GroupMembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: group_id, AttributeType: S }
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: group_id-index
          KeySchema:
            - { AttributeName: group_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: user_id-index
          KeySchema:
            - { AttributeName: user_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # The group index uses createdAt as a sort key for chronological quiz queries.
  QuizzesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: group_id, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: group_id-index
          KeySchema:
            - { AttributeName: group_id, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Durable quiz event registrations are retained until EventBridge accepts them.
  OutboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  # Persistent lock serializes notification reconciliation and related mutations.
  NotificationLockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  # Dedicated event bus receives quiz-created events from the outbox relay.
  QuizEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-quiz-events"

  # Store failed notification events for 14 days with SQS-managed encryption.
  # Trivy does not recognize SqsManagedSseEnabled in CloudFormation; the template test enforces it.
  #trivy:ignore:AWS-0096
  NotificationFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Allow the listed EventBridge rules to deliver failures to the queue.
  NotificationFailureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationFailureQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationFailureQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt OutboxSchedule.Arn
                  - !GetAtt ReconciliationSchedule.Arn
                  - !GetAtt QuizCreatedRule.Arn

  # Retain and rotate the key used to encrypt operational SNS alarm messages.
  OperationsAlarmKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypt operational alarm messages in the SNS topic
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Enable account IAM policies to grant key access.
          - Sid: EnableAccountIAMPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          # CloudWatch needs these operations to publish encrypted alarms.
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: [kms:Decrypt, "kms:GenerateDataKey*"]
            Resource: "*"

  # Encrypted topic for operational alarms, separate from group notifications.
  OperationsAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-operations"
      KmsMasterKeyId: !GetAtt OperationsAlarmKey.Arn

  # Permit account management and publishing from the specific CloudWatch alarm.
  OperationsAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OperationsAlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            # Restrict the topic policy to actions supported on an SNS topic.
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref OperationsAlarmTopic
          - Sid: AllowFailureAlarm
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OperationsAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-notification-failure"

  # Alarm when at least one failure message is visible in the queue.
  NotificationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: OperationsAlarmTopicPolicy
    Properties:
      AlarmName: !Sub "${AWS::StackName}-notification-failure"
      AlarmDescription: Notification delivery or scheduling failed; inspect the failure queue.
      AlarmActions: [!Ref OperationsAlarmTopic]
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationFailureQueue.QueueName
      Statistic: Maximum
      # Evaluate a one-minute period; missing metrics do not trigger the alarm.
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Send pending outbox events to EventBridge, with only one concurrent relay.
  OutboxRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: relayOutbox.handler
      Role: !GetAtt NotificationRole.Arn
      Timeout: 900
      ReservedConcurrentExecutions: 1
      # After asynchronous retries are exhausted, send the invocation to SQS.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotificationFailureQueue.Arn

  # Reconcile group SNS topics and subscriptions with current membership.
  ReconcileNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: reconcileNotifications.handler
      Role: !GetAtt NotificationRole.Arn
      Timeout: 900
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotificationFailureQueue.Arn

  # Publish a quiz-created notification to the corresponding group SNS topic.
  NotifyQuizCreatedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: notifyQuizCreated.handler
      Role: !GetAtt NotificationRole.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotificationFailureQueue.Arn

  # Run the relay every minute; failed EventBridge deliveries go to SQS.
  OutboxSchedule:
    Type: AWS::Events::Rule
    DependsOn: QuizCreatedRulePermission
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: outbox
          Arn: !GetAtt OutboxRelayFunction.Arn
          DeadLetterConfig: { Arn: !GetAtt NotificationFailureQueue.Arn }

  # Reconcile topics and subscriptions every five minutes.
  ReconciliationSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: reconcile
          Arn: !GetAtt ReconcileNotificationsFunction.Arn
          DeadLetterConfig: { Arn: !GetAtt NotificationFailureQueue.Arn }

  # Route matching quiz-created events on the dedicated bus to the notifier.
  QuizCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref QuizEventBus
      EventPattern:
        source: [quiz.app]
        detail-type: [QuizCreated]
      Targets:
        - Id: notify
          Arn: !GetAtt NotifyQuizCreatedFunction.Arn
          DeadLetterConfig: { Arn: !GetAtt NotificationFailureQueue.Arn }

  # Allow the outbox schedule to invoke the relay Lambda.
  OutboxSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OutboxRelayFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OutboxSchedule.Arn

  # Allow the reconciliation schedule to invoke the reconciliation Lambda.
  ReconciliationSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReconcileNotificationsFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReconciliationSchedule.Arn

  # Allow the quiz-created rule to invoke the notification Lambda.
  QuizCreatedRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotifyQuizCreatedFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt QuizCreatedRule.Arn

  # The quiz index retrieves attempts for personal history and leaderboards.
  QuizResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: quiz_id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: quiz_id-index
          KeySchema:
            - { AttributeName: quiz_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # ---------------------------------------------------------------- Lambda functions
  # Each HTTP event connects an API method/path to the named bundled handler.
  # Protected routes are checked by API Gateway and again by application code.
  # Handler names refer to exports in the modules generated by build.mjs.
  # Verify bearer tokens at API Gateway before protected handlers are invoked.
  TokenAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorize.handler
      Policies:
        - AWSLambdaBasicExecutionRole

  # Results support both personal history and the participant leaderboard.
  GetQuizResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getQuizResults.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes/{id}/results
            Method: GET

  # Registration and login are public; login issues an application token.
  RegisterUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: registerUser.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/register
            Method: POST
            Auth:
              Authorizer: NONE

  # Authenticate credentials and issue an application token without prior auth.
  LoginUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: loginUser.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/login
            Method: POST
            Auth:
              Authorizer: NONE

  # Profile routes require authentication; update and delete check user identity.
  # List user profiles without exposing password hashes.
  GetUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getUsers.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/users
            Method: GET

  # Return or provision the profile identified by the verified token.
  SyncUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: syncUser.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sync-user
            Method: POST

  # Retrieve a user profile by its user_id.
  GetUserByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getUserById.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/user/{user_id}
            Method: GET

  # Update the authenticated user's own profile.
  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateUser.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/update-user/{user_id}
            Method: PUT

  # Delete the authenticated user's own profile.
  DeleteUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: deleteUser.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/delete-user/{user_id}
            Method: DELETE

  # Group routes cover creation, listing, lookup, owner updates and deletion.
  # Create a group and its owner's membership.
  CreateGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: createGroup.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups
            Method: POST

  # List groups available to the authenticated user.
  GetGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getGroups.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups
            Method: GET

  # Retrieve a group by its ID.
  GetGroupByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getGroupById.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/{groupId}
            Method: GET

  # Update a group; the handler checks ownership.
  UpdateGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateGroup.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/{groupId}
            Method: PUT

  # Delete a group; the handler checks ownership.
  DeleteGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: deleteGroup.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/{groupId}
            Method: DELETE

  # Join a group using an invite code.
  JoinGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: joinGroup.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/join
            Method: POST

  # Member listing, individual lookup and leaving have separate route handlers.
  # List memberships for a group.
  GetGroupMembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getGroupMembers.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/{groupId}/members
            Method: GET

  # Retrieve a particular group membership.
  GetGroupMemberByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getGroupMemberById.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/{groupId}/members/{memberId}
            Method: GET

  # Remove the authenticated user's membership from a group.
  LeaveGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: leaveGroup.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/groups/{groupId}/members/leave
            Method: DELETE

  # Quiz routes cover creation, listing, retrieval, updates and deletion.
  # Create a quiz for a group after checking the caller's membership.
  CreateQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: createQuiz.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes
            Method: POST

  # List quizzes for groups where the caller is a member or owner; optionally
  # restrict the results to one accessible group.
  GetQuizzesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getQuizzes.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes
            Method: GET

  # Retrieve a quiz by ID if the caller is a group member or owner.
  GetQuizByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getQuizById.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes/{id}
            Method: GET

  # Update a quiz if the caller is its creator.
  UpdateQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateQuiz.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes/{id}
            Method: PUT

  # Delete a quiz and its saved results if the caller is its creator.
  DeleteQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: deleteQuiz.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes/{id}
            Method: DELETE

  # Submission is scored server-side and creates a saved attempt.
  TakeQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: takeQuiz.handler
      Role: !GetAtt FunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/quizzes/{id}/submit
            Method: POST


# Export the API URL and resource identifiers needed for operations.
Outputs:
  # Include the stage and /api/ prefix so the frontend can append route paths.
  ApiUrl:
    Description: Base URL for the frontend (set VITE_API_URL to this value)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}/api/"
  # Queue to inspect and replay failed notification work.
  NotificationFailureQueueUrl:
    Description: Failure queue for notification targets and asynchronous Lambda invocations
    Value: !Ref NotificationFailureQueue
  # Lock table used when investigating a stuck notification lock.
  NotificationLockTableName:
    Description: Persistent lock table for notification reconciliation and membership changes
    Value: !Ref NotificationLockTable
  # Event bus receiving quiz creation events.
  NotificationEventBusName:
    Description: Event bus receiving quiz creation events
    Value: !Ref QuizEventBus
  # Operators must subscribe and confirm an endpoint to receive alarms.
  OperationsAlarmTopicArn:
    Description: SNS topic for operational alarms; subscribe and confirm an email endpoint
    Value: !Ref OperationsAlarmTopic
