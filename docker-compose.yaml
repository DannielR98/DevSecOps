services:
  frontend:
    container_name: quiz-container-frontend
    build:
      context: ./frontend/quiz
      dockerfile: Dockerfile
    image: quiz-img-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/quiz:/app
      - quiz-volume-frontend:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL to the serverless API URL}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}

volumes:
  quiz-volume-frontend:
