services:
  frontend:
    container_name: quiz-container-frontend
    build:
      context: ./frontend/quiz
      dockerfile: Dockerfile
    image: quiz-img-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/quiz:/app
      - quiz-volume-frontend:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_AUTH0_DOMAIN: dev-oz2aw2gea6l10gab.us.auth0.com
      VITE_AUTH0_CLIENT_ID: nozbtl9zVfqFJPeVZE6XfnjTAsOchVsy
      VITE_AUTH0_AUDIENCE: https://quiz-api.dev

  backend:
    container_name: quiz-container-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quiz-img-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - quiz-volume-backend:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH0_AUDIENCE: https://quiz-api.dev
      AUTH0_ISSUER_BASE_URL: https://dev-oz2aw2gea6l10gab.us.auth0.com/
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - quiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  quiz-volume-frontend:
  quiz-volume-backend:
  quiz_postgres_data:
    name: quiz_postgres_data
  pgadmin_data:
