services:
  frontend:
    container_name: quiz-container-frontend
    build:
      context: ./frontend/quiz
      dockerfile: Dockerfile
    image: quiz-img-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/quiz:/app
      - quiz-volume-frontend:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}

  backend:
    container_name: quiz-container-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quiz-img-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - quiz-volume-backend:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_key_12345}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY}}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres_password_123}@postgres:5432/${POSTGRES_DB:-quiz_devsecops}}
    depends_on:
      - postgres

  postgres:
    container_name: quiz-container-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quiz_devsecops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
    ports:
      - "5432:5432"
    volumes:
      - quiz-volume-postgres:/var/lib/postgresql/data

volumes:
  quiz-volume-frontend:
  quiz-volume-backend:
  quiz-volume-postgres:
